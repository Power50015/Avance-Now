services:
  app:
    build:
      context: .
      target: runner
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - path: ./src
          action: rebuild

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: avance_now
      POSTGRES_USER: avn_user
      POSTGRES_PASSWORD: ${AVN_DB_PASSWORD:-devpassword}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U avn_user -d avance_now']
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  pgdata:
